<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TypeID mock, Frutiger Aero</title>
<style>
/* Style study: the identify-match screen (mocks.html 07) in Frutiger Aero, the mid-2000s look of
   glass panels, glossy aqua pills, sky gradients, grass and bubbles. Same content and layout as the
   neobrutalist mock, so the two compare directly. Open Sans stands in for Frutiger / Segoe. */
@font-face { font-family: "Open Sans"; font-weight: 400; src: url(fonts/open-sans-latin-400-normal.woff2); }
@font-face { font-family: "Open Sans"; font-weight: 600; src: url(fonts/open-sans-latin-600-normal.woff2); }
@font-face { font-family: "Open Sans"; font-weight: 700; src: url(fonts/open-sans-latin-700-normal.woff2); }

:root {
  --ink: #0b3556;
  --ink-2: #3f6884;
  --aqua: #19b4e8;
  --aqua-deep: #0a7fc4;
  --leaf: #5fcf3a;
  --glass: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.38));
  --glass-border: rgba(255,255,255,.85);
  --glass-shadow: 0 12px 34px rgba(4, 64, 120, .22), inset 0 1px 0 rgba(255,255,255,.95);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font: 400 15px/1.5 "Open Sans", sans-serif;
  -webkit-font-smoothing: antialiased; position: relative; overflow-x: hidden;
  background: linear-gradient(180deg, #3aa6e6 0%, #7fd0f5 38%, #c9efff 62%, #e9fbff 74%);
}
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---- scenery: sun glow, clouds, hills, bubbles ---- */
.scene { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.sun { position: absolute; top: -220px; left: 50%; width: 900px; height: 700px; transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,.35) 45%, transparent 75%); }
.rays { position: absolute; top: -400px; left: 50%; width: 1800px; height: 1400px; transform: translateX(-50%);
  background: repeating-conic-gradient(from 0deg at 50% 30%, rgba(255,255,255,.13) 0 6deg, transparent 6deg 18deg);
  mask-image: radial-gradient(closest-side at 50% 30%, black, transparent 80%); }
.cloud { position: absolute; border-radius: 50%; background: rgba(255,255,255,.75); filter: blur(18px); }
.hills { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; }
.bubble { position: absolute; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,.25) 22%, rgba(120,210,255,.12) 55%, rgba(255,255,255,.55) 72%, rgba(255,255,255,.08) 74%);
  box-shadow: inset -4px -6px 14px rgba(255,255,255,.35), 0 4px 18px rgba(0,90,160,.12); }

/* ---- glass and gloss primitives ---- */
.glass { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 18px; box-shadow: var(--glass-shadow);
  backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); }
.gloss { position: relative; overflow: hidden; }
.gloss::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.15)); border-radius: inherit; border-bottom-left-radius: 40% 12px; border-bottom-right-radius: 40% 12px; pointer-events: none; }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 18px; border-radius: 999px;
  font: 600 14.5px "Open Sans"; color: var(--ink); border: 1px solid rgba(255,255,255,.9);
  background: linear-gradient(180deg, #ffffff, #dff3ff); box-shadow: 0 3px 8px rgba(0,80,150,.18), inset 0 -2px 4px rgba(0,120,200,.12); }
.pill.aqua { color: #fff; border-color: #0b84c8; text-shadow: 0 1px 1px rgba(0,60,110,.45);
  background: linear-gradient(180deg, #7fdcff 0%, #22b5ee 48%, #0796d9 52%, #22c0f2 100%);
  box-shadow: 0 4px 12px rgba(0,110,190,.35), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -3px 8px rgba(0,180,255,.5); }
.pill.big { height: 54px; width: 100%; font-size: 17px; }

/* ---- shell ---- */
.wrap { position: relative; z-index: 1; }
.topbar { margin: 18px auto 0; max-width: 1180px; padding: 12px 18px; display: flex; align-items: center; gap: 22px; border-radius: 22px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .logo { width: 48px; height: 48px; border-radius: 13px; box-shadow: 0 6px 14px rgba(0,40,90,.35), inset 0 0 0 1px rgba(255,255,255,.4); overflow: hidden; position: relative; }
.brand .logo img { width: 100%; height: 100%; display: block; }
.brand .logo::after { content: ""; position: absolute; inset: 0 0 50% 0; background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0)); }
.brand .name { font: 700 24px/1 "Open Sans"; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.9); }
.brand .tag { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.seg { margin-left: auto; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: linear-gradient(180deg, rgba(0,90,160,.12), rgba(255,255,255,.4)); box-shadow: inset 0 1px 3px rgba(0,60,120,.2), 0 1px 0 rgba(255,255,255,.9); }
.seg .pill { box-shadow: none; background: transparent; border-color: transparent; color: var(--ink-2); }
.seg .pill.aqua { color: #fff; border-color: #0b84c8; background: linear-gradient(180deg, #7fdcff 0%, #22b5ee 48%, #0796d9 52%, #22c0f2 100%); box-shadow: 0 3px 10px rgba(0,110,190,.35), inset 0 1px 0 rgba(255,255,255,.7); }
.page { max-width: 1180px; margin: 0 auto; padding: 28px 0 48px; display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 26px; align-items: start; }
.footer { max-width: 1180px; margin: 0 auto; padding: 0 0 40px; font-size: 13px; color: #fff; text-shadow: 0 1px 3px rgba(0,60,20,.6); }

/* ---- task card ---- */
.task { overflow: hidden; }
.task-head { display: flex; align-items: center; gap: 14px; padding: 16px 24px; color: #fff; text-shadow: 0 1px 2px rgba(0,60,110,.5);
  background: linear-gradient(180deg, #6fd6ff 0%, #1fb0ec 50%, #0a93d6 51%, #2bc3f3 100%); border-bottom: 1px solid rgba(0,100,170,.4); }
.task-head h2 { font-size: 24px; font-weight: 600; }
.orb { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 35% 30%, #c9f3ff 0 12%, #36c3f5 40%, #0a7fc4 85%); box-shadow: 0 3px 8px rgba(0,60,110,.35), inset 0 -3px 6px rgba(0,60,130,.35); }
.chip { margin-left: auto; padding: 4px 12px; border-radius: 999px; font: 600 12.5px "Open Sans"; color: var(--ink);
  background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(220,243,255,.9)); box-shadow: inset 0 1px 0 #fff, 0 1px 3px rgba(0,60,110,.25); text-shadow: none; }
.task-body { padding: 26px 24px 28px; display: flex; flex-direction: column; gap: 24px; }

.best { display: flex; align-items: center; gap: 18px; padding: 18px 22px; border-radius: 16px;
  background: linear-gradient(180deg, rgba(220,255,200,.85), rgba(140,230,110,.55)); border: 1px solid rgba(255,255,255,.95);
  box-shadow: 0 8px 20px rgba(40,140,40,.2), inset 0 1px 0 #fff; }
.best .av { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font: 700 26px "Open Sans"; color: #fff; text-shadow: 0 1px 2px rgba(0,70,20,.5);
  background: radial-gradient(circle at 35% 28%, #e9ffd8 0 10%, #78dd4c 42%, #2c9e22 88%); box-shadow: 0 4px 10px rgba(30,110,20,.4), inset 0 -4px 8px rgba(20,90,10,.35); }
.best .lbl { font: 700 11.5px "Open Sans"; letter-spacing: .12em; text-transform: uppercase; color: #2c7a1e; }
.best .who { font: 600 32px/1.1 "Open Sans"; }
.best .score { margin-left: auto; text-align: right; }
.best .score b { display: block; font: 700 34px/1.05 "Open Sans"; color: #1f7d16; text-shadow: 0 1px 0 rgba(255,255,255,.9); }
.best .tagline { display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 999px; font: 700 12px "Open Sans"; color: #fff; text-shadow: 0 1px 1px rgba(0,70,20,.5);
  background: linear-gradient(180deg, #9bf06f, #43bf2a 50%, #2fa61a 51%, #58cf35); box-shadow: 0 2px 6px rgba(30,110,20,.35), inset 0 1px 0 rgba(255,255,255,.6); }

.ranks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rank { display: grid; grid-template-columns: 32px minmax(0, 150px) 1fr 70px; align-items: center; gap: 14px; padding: 9px 14px; border-radius: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(235,248,255,.55)); border: 1px solid rgba(255,255,255,.95); box-shadow: 0 2px 8px rgba(0,80,150,.1); }
.rank.top { background: linear-gradient(180deg, rgba(225,255,210,.95), rgba(190,245,170,.6)); box-shadow: 0 4px 14px rgba(40,140,40,.2); }
.rank.fade { opacity: .5; }
.rank .pos { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 13px "Open Sans"; color: #fff; text-shadow: 0 1px 1px rgba(0,50,90,.5);
  background: radial-gradient(circle at 35% 30%, #d6f4ff 0 10%, #5bb9e0 45%, #2b7fb0 90%); }
.rank.top .pos { background: radial-gradient(circle at 35% 30%, #e9ffd8 0 10%, #78dd4c 45%, #2c9e22 90%); }
.rank .who { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank .score { text-align: right; font-weight: 700; color: var(--ink); }
.tube { position: relative; height: 14px; border-radius: 999px; background: linear-gradient(180deg, rgba(0,60,120,.16), rgba(255,255,255,.7)); box-shadow: inset 0 1px 3px rgba(0,50,100,.3); }
.tube .fill { height: 100%; border-radius: 999px; position: relative; }
.tube .fill::after { content: ""; position: absolute; left: 4px; right: 4px; top: 2px; height: 40%; border-radius: 999px; background: rgba(255,255,255,.6); }
.fill.green { background: linear-gradient(180deg, #a7f57e, #3fbf25 60%, #2a9f17); }
.fill.blue { background: linear-gradient(180deg, #b6e2f7, #6ab3d8 60%, #4a93bd); }
.tube .thr { position: absolute; top: -6px; bottom: -6px; width: 2px; background: #ff8a1f; border-radius: 2px; box-shadow: 0 0 6px rgba(255,140,30,.9); }
.thr-label { position: relative; height: 18px; font: 700 11.5px "Open Sans"; color: #d0650a; }
.thr-label span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

/* ---- rail ---- */
.rail { display: flex; flex-direction: column; gap: 22px; }
.rail .glass { padding: 18px 18px 20px; }
.rail h3 { font-size: 17px; margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 9px 11px; border-radius: 12px; background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(225,244,255,.6)); border: 1px solid #fff; box-shadow: 0 2px 6px rgba(0,80,150,.12); }
.stat b { display: block; font: 700 20px/1.2 "Open Sans"; color: var(--aqua-deep); }
.stat span { font-size: 12px; color: var(--ink-2); }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 64px; margin-top: 14px; padding: 6px; border-radius: 12px; background: linear-gradient(180deg, rgba(0,60,120,.1), rgba(255,255,255,.6)); box-shadow: inset 0 1px 3px rgba(0,50,100,.2); }
.bars i { flex: 1; border-radius: 3px 3px 1px 1px; background: linear-gradient(90deg, #6fe04a, #2fae1c); box-shadow: inset 1px 0 0 rgba(255,255,255,.5); }
.link { font-weight: 600; color: var(--aqua-deep); text-decoration: underline; text-underline-offset: 3px; }
.counts { display: flex; gap: 10px; }
.counts .pill { width: 54px; height: 44px; font-size: 16px; }
.rates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.rate { padding: 9px 11px; border-radius: 12px; background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(225,244,255,.6)); border: 1px solid #fff; }
.rate.on { background: linear-gradient(180deg, #d9f6ff, #9fe2fb); box-shadow: 0 3px 10px rgba(0,120,200,.25), inset 0 1px 0 #fff; }
.rate b { display: block; font: 700 20px "Open Sans"; color: var(--aqua-deep); }
.rate span { font-size: 12px; color: var(--ink-2); }
.small { font-size: 13px; } .muted { color: var(--ink-2); }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="rays"></div><div class="sun"></div>
  <div class="cloud" style="left:6%;top:150px;width:260px;height:70px"></div>
  <div class="cloud" style="left:62%;top:110px;width:340px;height:80px;opacity:.8"></div>
  <div class="cloud" style="left:80%;top:300px;width:220px;height:60px;opacity:.7"></div>
  <svg class="hills" viewBox="0 0 1280 420" preserveAspectRatio="none">
    <defs>
      <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9be86a"/><stop offset="1" stop-color="#3aa52a"/></linearGradient>
      <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fdc4c"/><stop offset="1" stop-color="#1f8a1d"/></linearGradient>
    </defs>
    <path d="M0 210 C 220 120, 420 150, 640 200 S 1060 120, 1280 170 L1280 420 L0 420Z" fill="url(#h1)"/>
    <path d="M0 290 C 260 220, 520 300, 760 260 S 1120 220, 1280 270 L1280 420 L0 420Z" fill="url(#h2)"/>
    <path d="M0 210 C 220 120, 420 150, 640 200 S 1060 120, 1280 170" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3"/>
  </svg>
  <div class="bubble" style="left:3%;top:420px;width:90px;height:90px"></div>
  <div class="bubble" style="left:9%;top:560px;width:40px;height:40px"></div>
  <div class="bubble" style="left:92%;top:180px;width:70px;height:70px"></div>
  <div class="bubble" style="left:95%;top:520px;width:46px;height:46px"></div>
  <div class="bubble" style="left:88%;top:640px;width:110px;height:110px"></div>
  <div class="bubble" style="left:46%;top:40px;width:30px;height:30px"></div>
</div>

<div class="wrap" id="app"></div>
<script>
const ic = {
  search: '<path d="M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10zM10.6 10.6L14 14"/>',
  user: '<path d="M8 8a2.6 2.6 0 1 0 0-5.2A2.6 2.6 0 0 0 8 8zM3 14c.6-2.6 2.6-4 5-4s4.4 1.4 5 4"/>',
  shield: '<path d="M8 1.8l5 2v4c0 3-2.2 5.2-5 6.4C5.2 13 3 10.8 3 7.8v-4z"/>',
  map: '<path d="M1.8 3.8l4-1.6 4.4 1.6 4-1.6v10l-4 1.6-4.4-1.6-4 1.6zM5.8 2.2v10M10.2 3.8v10"/>',
  arrow: '<path d="M3 8h10M9 4l4 4-4 4"/>',
};
const I = (n, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic[n]}</svg>`;

const rows = [["Andrei", .912], ["aalto_10482", .741], ["Maria", .733], ["aalto_88213", .702], ["aalto_51120", .688], ["aalto_30117", .671], ["aalto_77302", .664]];
const thr = .75;
const dwell = [96,88,104,79,92,121,85,99,110,77,94,102,87,130,91,83,97,108,76,95,89,115,93,86,101,98,82,107,90,96,112,84,99,87,103,94,80,118,92,88];
const maxD = Math.max(...dwell);

document.getElementById("app").innerHTML = `
<header class="topbar glass">
  <div class="brand"><span class="logo"><img src="../public/mark.png" alt=""></span>
    <div><div class="name">TypeID</div><div class="tag">Recognizes you by <b>how</b> you type, not what you type.</div></div></div>
  <nav class="seg"><span class="pill">${I("user", 15)}Enroll</span><span class="pill aqua gloss">${I("search", 15)}Identify</span><span class="pill">${I("shield", 15)}Authenticate</span></nav>
  <span class="pill gloss">${I("map")}Map</span>
</header>
<div class="page">
  <main class="task glass">
    <div class="task-head gloss"><span class="orb">${I("search", 18)}</span><h2>Who is typing?</h2><span class="chip">1 prompt · threshold 0.75</span></div>
    <div class="task-body">
      <div class="best"><span class="av">A</span>
        <div><div class="lbl">Best match</div><div class="who">Andrei</div></div>
        <div class="score"><b class="num">0.912</b><span class="tagline">Strong match</span></div></div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><h3 style="font-size:18px">Ranked candidates</h3><span class="small muted">finds 52% with 1 prompt</span></div>
        <div class="thr-label" style="margin:0 84px 4px 210px"><span style="left:${thr * 100}%">threshold 0.75</span></div>
        <ol class="ranks">${rows.map(([n, s], i) => `
          <li class="rank ${i === 0 ? "top" : ""} ${i >= 5 ? "fade" : ""}"><span class="pos">${i + 1}</span><span class="who">${n}</span>
            <div class="tube"><div class="fill ${s >= thr ? "green" : "blue"}" style="width:${s * 100}%"></div><span class="thr" style="left:${thr * 100}%"></span></div>
            <span class="score num">${s.toFixed(3)}</span></li>`).join("")}</ol>
      </div>
      <span class="pill aqua big gloss">Try another sentence ${I("arrow")}</span>
    </div>
  </main>
  <aside class="rail">
    <section class="glass"><h3>What was measured</h3>
      <div class="stats">${[["41", "keystrokes"], ["9.8s", "duration"], ["49", "wpm"], ["96ms", "avg dwell"], ["148ms", "avg flight"], ["2", "backspaces"]].map(([v, l]) =>
        `<div class="stat"><b class="num">${v}</b><span>${l}</span></div>`).join("")}</div>
      <div class="bars">${dwell.map((v) => `<i style="height:${(v / maxD) * 100}%"></i>`).join("")}</div>
      <p class="small muted" style="margin-top:6px">Dwell time per keystroke</p>
      <p style="margin-top:12px"><span class="link small">Show raw event log</span></p></section>
    <section class="glass"><h3>Prompts to type</h3>
      <div class="counts"><span class="pill aqua gloss">1</span><span class="pill gloss">5</span><span class="pill gloss">10</span></div>
      <p class="small muted" style="margin-top:10px">More prompts, steadier profile, fewer mistakes.</p>
      <div class="rates">${[[1, 52], [5, 88], [10, 93]].map(([k, f]) => `<div class="rate ${k === 1 ? "on" : ""}"><b>${f}%</b><span>found · ${k} prompt${k > 1 ? "s" : ""}</span></div>`).join("")}</div>
      <p class="small muted" style="margin-top:10px">With 1 prompt, someone who isn't enrolled gets named about 22% of the time.</p></section>
  </aside>
</div>
<footer class="footer">Open-set 1:N gallery search on typing rhythm. New people enroll without retraining the model.</footer>`;
</script>
</body>
</html>
